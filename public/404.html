<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>akshayb2bsolutions</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License: https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, then redirects to index.html
      var pathSegmentsToKeep = 0;
      var l = window.location;

      // Also set sessionStorage as an additional fallback
      try {
        sessionStorage.setItem('spa_redirect', l.href);
      } catch (e) {}

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <!-- GitHub Pages Single Page Application 404 Redirect Handler -->
  </body>
</html>
